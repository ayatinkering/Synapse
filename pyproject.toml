[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "synapse-research"
version = "0.1.0"
description = "An inspectable research pipeline with offline fixture demonstrations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "filelock>=3,<4",
    "pydantic>=2,<3",
    "streamlit>=1.57,<2",
]

[project.scripts]
synapse = "synapse.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.hatch.build.targets.sdist]
include = ["/src/", "/tests/", "/pyproject.toml", "/README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra -m 'not live'"
markers = ["live: opt-in external provider checks; excluded from default CI"]
